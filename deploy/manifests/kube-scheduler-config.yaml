apiVersion: v1
kind: ConfigMap
metadata:
  name: gpusim-scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: true
      resourceName: gpusim-scheduler
      resourceNamespace: kube-system
    profiles:
      - schedulerName: kube-scheduler-gpusim
        plugins:
          filter:
            enabled:
              - name: GPUSim
          score:
            enabled:
              - name: GPUSim
                weight: 2
          reserve:
            enabled:
              - name: GPUSim
        pluginConfig:
          - name: GPUSim
            args: {}
